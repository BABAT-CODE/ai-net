name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npx vite build

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          working-directory: frontend
          configPath: ./lighthouserc.cjs

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci
          if-no-files-found: warn

      - name: Post Lighthouse scores to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsDir = path.join('frontend', '.lighthouseci');
            let results = [];

            try {
              const files = fs.readdirSync(resultsDir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
              for (const file of files) {
                const content = JSON.parse(fs.readFileSync(path.join(resultsDir, file), 'utf8'));
                results.push({
                  url: content.finalUrl || content.requestedUrl,
                  scores: {
                    performance: Math.round((content.categories?.performance?.score || 0) * 100),
                    accessibility: Math.round((content.categories?.accessibility?.score || 0) * 100),
                    seo: Math.round((content.categories?.seo?.score || 0) * 100),
                    bestPractices: Math.round((content.categories?.['best-practices']?.score || 0) * 100),
                    lcp: Number((content.audits?.['largest-contentful-paint']?.numericValue || 0) / 1000).toFixed(2),
                    cls: Number(content.audits?.['cumulative-layout-shift']?.numericValue || 0).toFixed(3),
                    tbt: Number(content.audits?.['total-blocking-time']?.numericValue || 0).toFixed(0),
                  },
                });
              }
            } catch (err) {
              core.warning(`Could not read Lighthouse results: ${err.message}`);
            }

            if (results.length === 0) {
              core.warning('No Lighthouse results found. Skipping PR comment.');
              return;
            }

            let body = '## 🔍 Lighthouse CI Results\n\n';
            body += '| Route | Perf | A11y | Best | SEO | LCP | CLS | TBT | Trend |\n';
            body += '|-------|------|------|------|-----|-----|-----|-----|-------|\n';

            let allPassed = true;
            for (const r of results) {
              const route = new URL(r.url).pathname || '/';
              const perf = r.scores.performance;
              const a11y = r.scores.accessibility;
              const seo = r.scores.seo;
              const bp = r.scores.bestPractices;
              const trend = 'n/a';

              const perfPass = perf >= 90;
              const a11yPass = a11y >= 95;
              const bpPass = bp >= 95;
              const seoPass = seo >= 90;
              const lcpPass = Number(r.scores.lcp) < 2.5;
              const clsPass = Number(r.scores.cls) < 0.1;
              const tbtPass = Number(r.scores.tbt) < 200;

              if (!perfPass || !a11yPass || !bpPass || !seoPass || !lcpPass || !clsPass || !tbtPass) {
                allPassed = false;
              }

              body += `| \`${route}\` | ${perfPass ? '✅' : '❌'} ${perf}/100 | ${a11yPass ? '✅' : '❌'} ${a11y}/100 | ${bpPass ? '✅' : '❌'} ${bp}/100 | ${seoPass ? '✅' : '❌'} ${seo}/100 | ${lcpPass ? '✅' : '❌'} ${r.scores.lcp}s | ${clsPass ? '✅' : '❌'} ${r.scores.cls} | ${tbtPass ? '✅' : '❌'} ${r.scores.tbt}ms | ${trend} |\n`;
            }

            body += '\n### Thresholds\n';
            body += '- **Performance**: ≥ 90\n';
            body += '- **Accessibility**: ≥ 95\n';
            body += '- **Best Practices**: ≥ 95\n';
            body += '- **SEO**: ≥ 90\n';
            body += '- **LCP**: < 2.5s\n';
            body += '- **CLS**: < 0.1\n';
            body += '- **TBT**: < 200ms\n';

            if (allPassed) {
              body += '\n✅ All Lighthouse gates passed.\n';
            } else {
              body += '\n❌ **One or more Lighthouse gates failed.**\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🔍 Lighthouse CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
